{% extends "base.html" %}

{% block title %}Create Account - SmartShop{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h1>Create your account</h1>
        <p class="muted">Create a customer account before placing an order.</p>
        <form method="post">
            <div class="field"><label>Full name</label><input name="name" required></div>
            <div class="field"><label>Username</label><input name="username" required></div>
            <div class="field"><label>Password</label><input type="password" name="password" minlength="6" required></div>
            <button class="btn full" type="submit">Create Account</button>
        </form>
        <p class="muted">Already registered? <a class="green-link" href="{{ url_for('login') }}">Login</a></p>
    </div>
</div>
{% endblock %}
