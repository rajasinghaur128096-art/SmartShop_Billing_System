name: Python application

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 3.9
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r smartshop_build/requirements.txt
        pip install flake8 pytest
    
    - name: Lint with flake8
      run: |
        flake8 smartshop_build/app.py --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 smartshop_build/app.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Test with pytest
      run: |
        pytest smartshop_build/ --tb=short || echo "No tests found"
